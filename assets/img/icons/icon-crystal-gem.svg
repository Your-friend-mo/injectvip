<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Radial glow in background -->
    <radialGradient id="gem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Facet gradients -->
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="facet-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="facet-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <filter id="crystal-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Aura Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#gem-glow)"/>

  <!-- Main Crystal / Diamond Shape -->
  <g filter="url(#crystal-drop-shadow)">
    <!-- Top Crown Main Facet -->
    <polygon points="50,14 74,32 50,42 26,32" fill="url(#facet-top)"/>

    <!-- Top Left Corner Facet -->
    <polygon points="26,32 50,14 36,12" fill="#bae6fd" opacity="0.9"/>
    
    <!-- Top Right Corner Facet -->
    <polygon points="74,32 50,14 64,12" fill="#e0f2fe" opacity="0.95"/>

    <!-- Center Upper Kite -->
    <polygon points="50,42 74,32 68,64 50,86" fill="url(#facet-right)"/>

    <!-- Center Left Upper Kite -->
    <polygon points="50,42 26,32 32,64 50,86" fill="url(#facet-left)"/>

    <!-- Center Diamond Core -->
    <polygon points="50,42 62,54 50,82 38,54" fill="url(#facet-center)"/>

    <!-- Far Left Lower Facet -->
    <polygon points="26,32 32,64 18,48" fill="#0369a1"/>

    <!-- Far Right Lower Facet -->
    <polygon points="74,32 68,64 82,48" fill="#0284c7"/>

    <!-- Bottom Point Shading -->
    <polygon points="50,86 38,54 50,82" fill="url(#facet-bottom)"/>
    <polygon points="50,86 62,54 50,82" fill="#082f49"/>

    <!-- Specular Highlight Sheen -->
    <polygon points="50,16 68,30 50,38 32,30" fill="#ffffff" opacity="0.45"/>
    <circle cx="48" cy="28" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
